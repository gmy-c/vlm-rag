task: sensitivity_classification_partial_unfreeze
seed: 42
device: cuda
dtype: bfloat16
data_root: data
manifest_dir: data/manifests/sensitivity
model: checkpoint
output_dir: models/sensitivity_unfreeze4

selected_layers: [0, 8, 16, 23, 27]
spatial_pool_size: 16
head_dim: 768
head_layers: 2
head_attention_heads: 12
gradient_checkpointing: true
dropout: 0.15
unfreeze_last_n: 4

# Start conservatively; profile 8/12/16/24 on the actual 5090. Effective
# batch remains 64 through accumulation even when physical batch is smaller.
batch_size: 16
gradient_accumulation_steps: 4
epochs: 8
learning_rate: 2.0e-4
head_learning_rate: 2.0e-4
vision_learning_rate: 1.0e-5
layer_weight_learning_rate: 1.0e-4
weight_decay: 0.02
warmup_ratio: 0.08
max_grad_norm: 1.0
early_stopping_patience: 3
target_recall: 0.90
num_workers: 8
prefetch_factor: 2

memory:
  target_reserved_gb: 26.0
  max_reserved_gb: 28.0
  max_device_used_gb: 29.0
