# Task boundary: query-to-page retrieval and downstream visual RAG.
task: retrieval_rag
data_dir: data
output_dir: outputs
model_dir: models
index_dir: indexes
log_dir: logs
top_k: 3
embedding_dim: 768
temperature: 0.07
epochs: 5
hidden_layer_weights: 0.2,0.3,0.5
train_ratio: 0.7
dev_ratio: 0.15

# 训练参数
# 显存安全默认值：micro-batch 2，累计 16 次后有效 batch 仍为 32
batch_size: 2
gradient_accumulation_steps: 16
index_batch_size: 2
learning_rate: 5.0e-5
warmup_ratio: 0.025
max_grad_norm: 1.0

# ColPali 模型参数
# 模型权重路径（相对于项目根目录，或 HuggingFace model ID）
# 本地路径示例: "checkpoint" → 自动解析为 <project_root>/checkpoint
colpali_model: "checkpoint"
lora_rank: 32
lora_alpha: 32
selected_layers_str: "0,8,16,23"
max_query_length: 64
device: "cuda"

# 生成器配置（API Key 通过环境变量 DOUBAO_API_KEY 设置，不写在此文件中）
generator:
  backend: "doubao"
  doubao_model: "doubao-seed-1-6-vision-250815"
  doubao_base_url: "https://ark.cn-beijing.volces.com/api/v3"
  max_tokens: 512
  temperature: 0.1
  timeout: 30
