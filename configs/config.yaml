data_dir: data
output_dir: outputs
model_dir: models
index_dir: indexes
log_dir: logs
top_k: 3
embedding_dim: 768
temperature: 0.07
epochs: 5
hidden_layer_weights: 0.2,0.3,0.5
train_ratio: 0.7
dev_ratio: 0.15

# 训练参数
batch_size: 8
gradient_accumulation_steps: 4
learning_rate: 5.0e-5
warmup_ratio: 0.025
max_grad_norm: 1.0

# ColPali 模型参数
colpali_model: "vidore/colpali-v1.3-merged"
lora_rank: 32
lora_alpha: 32
selected_layers_str: "0,8,16,23"
max_query_length: 64
device: "cuda"

# 生成器配置（API Key 通过环境变量 DOUBAO_API_KEY 设置，不写在此文件中）
generator:
  backend: "doubao"
  doubao_model: "doubao-seed-1-6-vision-250815"
  doubao_base_url: "https://ark.cn-beijing.volces.com/api/v3"
  max_tokens: 512
  temperature: 0.1
  timeout: 30
